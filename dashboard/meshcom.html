<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeshCom — IU5MGF-12</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --green: #3fb950;
    --red: #f85149; --blue: #58a6ff; --orange: #d29922;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; font-size: 14px; }

  /* NAV */
  nav { background: #010409; border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; align-items: center; gap: 6px; height: 48px; }
  nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
  nav a:hover, nav a.active { background: var(--card); color: var(--text); }
  .nav-logo { color: var(--blue); font-weight: bold; font-size: 15px; margin-right: 10px; }

  /* LAYOUT */
  .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
  h2 { font-size: 18px; margin-bottom: 16px; color: var(--text); display: flex; align-items: center; gap: 8px; }

  /* STATUS BAR */
  .status-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; flex: 1; min-width: 140px; }
  .stat-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .stat-card .value { font-size: 22px; font-weight: bold; }
  .stat-card .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .online  { color: var(--green); }
  .offline { color: var(--red); }

  /* BADGE */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
  .badge-green  { background: #1a3a2a; color: var(--green); }
  .badge-red    { background: #3a1a1a; color: var(--red); }
  .badge-blue   { background: #1a2a3a; color: var(--blue); }
  .badge-orange { background: #3a2a1a; color: var(--orange); }

  /* TABLES */
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 24px; overflow: hidden; }
  .section-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #0d1117; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  td { padding: 9px 12px; border-bottom: 1px solid #1c2128; font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1c2128; }

  /* RSSI BAR */
  .rssi-bar { display: flex; align-items: center; gap: 8px; }
  .rssi-fill { height: 6px; border-radius: 3px; background: var(--green); transition: width .3s; }

  /* CHART */
  .chart-wrap { padding: 16px; }
  canvas { max-height: 200px; }

  /* MONO */
  .mono { font-family: monospace; font-size: 12px; color: var(--muted); }

  /* RESPONSIVE */
  @media (max-width: 600px) { .stat-card { min-width: 120px; } th, td { padding: 6px 8px; } }
</style>
</head>
<body>

<nav>
  <span class="nav-logo">📡 IU5MGF</span>
  <a href="/">Home</a>
  <a href="/map">Mappa</a>
  <a href="/stations">Stazioni</a>
  <a href="/stats">Statistiche</a>
  <a href="/meshcom" class="active">MeshCom</a>
  <a href="/events">Eventi</a>
  <a href="/server">Server</a>
  <a href="/igate">iGate</a>
</nav>

<div class="container">

  <!-- STATUS -->
  <div class="status-bar" id="status-bar">
    <div class="stat-card"><div class="label">Nodo</div><div class="value" id="s-call">—</div><div class="sub" id="s-fw">—</div></div>
    <div class="stat-card"><div class="label">Stato</div><div class="value" id="s-online">—</div><div class="sub" id="s-lastseen">—</div></div>
    <div class="stat-card"><div class="label">Batteria</div><div class="value" id="s-batt">—</div><div class="sub" id="s-batt-v">—</div></div>
    <div class="stat-card"><div class="label">WiFi RSSI</div><div class="value" id="s-wifi">—</div><div class="sub">segnale AP</div></div>
    <div class="stat-card"><div class="label">Gateway</div><div class="value" id="s-gw">—</div><div class="sub" id="s-uptime">—</div></div>
  </div>

  <!-- MHEARD -->
  <div class="section">
    <div class="section-header">
      <span>🔊 Nodi sentiti (MHeard)</span>
      <span id="mheard-age" class="mono"></span>
    </div>
    <table>
      <thead><tr>
        <th>Callsign</th><th>RSSI</th><th>SNR</th><th>Dist (km)</th>
        <th>Hardware</th><th>Tipo</th><th>Ultimo</th><th>aprs.fi</th>
      </tr></thead>
      <tbody id="mheard-body"></tbody>
    </table>
  </div>

  <!-- RXLOG -->
  <div class="section">
    <div class="section-header">
      <span>📋 RX Log (ultimi 50 pacchetti)</span>
      <span id="rxlog-count" class="mono"></span>
    </div>
    <table>
      <thead><tr>
        <th>Ora</th><th>Sorgente</th><th>Dest</th><th>Path</th>
        <th>RSSI</th><th>SNR</th>
      </tr></thead>
      <tbody id="rxlog-body"></tbody>
    </table>
  </div>

</div>

<script>
const REFRESH = 60000;

function rssiColor(v) {
  if (v === null) return '#8b949e';
  if (v >= -60) return '#3fb950';
  if (v >= -80) return '#d29922';
  return '#f85149';
}

function rssiBar(v) {
  if (v === null) return '<span class="mono">—</span>';
  const pct = Math.max(0, Math.min(100, (v + 120) / 60 * 100));
  return `<div class="rssi-bar">
    <div class="rssi-fill" style="width:${pct}px;max-width:60px;background:${rssiColor(v)}"></div>
    <span style="color:${rssiColor(v)}">${v} dBm</span>
  </div>`;
}

async function loadStatus() {
  const d = await fetch('/api/meshcom/status').then(r => r.json());
  document.getElementById('s-call').textContent   = d.callsign || '—';
  document.getElementById('s-fw').textContent     = (d.firmware || '').split('(')[0].trim();
  const onlineEl = document.getElementById('s-online');
  onlineEl.textContent  = d.online ? 'ONLINE' : 'OFFLINE';
  onlineEl.className    = 'value ' + (d.online ? 'online' : 'offline');
  document.getElementById('s-lastseen').textContent = d.last_seen ? `ultimo poll ${d.last_seen}` : '—';
  document.getElementById('s-batt').textContent   = d.battery_pct != null ? `${d.battery_pct}%` : '—';
  document.getElementById('s-batt-v').textContent = d.battery_v  != null ? `${d.battery_v.toFixed(3)}V` : '—';
  document.getElementById('s-wifi').textContent   = d.wifi_rssi  != null ? `${d.wifi_rssi} dBm` : '—';
  document.getElementById('s-gw').innerHTML       = d.gateway_on
    ? '<span class="badge badge-green">ON</span>'
    : '<span class="badge badge-red">OFF</span>';
  document.getElementById('s-uptime').textContent = d.uptime_start ? `su dal ${d.uptime_start}` : '—';
}

async function loadMheard() {
  const rows = await fetch('/api/meshcom/mheard').then(r => r.json());
  document.getElementById('mheard-age').textContent = `${rows.length} nodi`;
  const tb = document.getElementById('mheard-body');
  tb.innerHTML = rows.map(r => `
    <tr>
      <td><b>${r.callsign}</b></td>
      <td>${rssiBar(r.rssi)}</td>
      <td style="color:${rssiColor(r.snr ? r.snr*3-120 : null)}">${r.snr != null ? r.snr+' dB' : '—'}</td>
      <td>${r.distance != null ? r.distance.toFixed(1) : '—'}</td>
      <td class="mono">${r.hardware || '—'}</td>
      <td><span class="badge badge-blue">${r.msg_type || '—'}</span></td>
      <td class="mono">${r.last_seen}</td>
      <td><a href="https://aprs.fi/?call=${r.callsign}" target="_blank" style="color:var(--blue)">↗</a></td>
    </tr>`).join('');
}

async function loadRxlog() {
  const rows = await fetch('/api/meshcom/rxlog').then(r => r.json());
  document.getElementById('rxlog-count').textContent = `${rows.length} entries`;
  const tb = document.getElementById('rxlog-body');
  tb.innerHTML = rows.slice(0,50).map(r => {
    const isHG  = r.dst_call === 'HG';
    const isPos = r.dst_call === '*';
    const badge = isHG  ? '<span class="badge badge-blue">HG</span>'
                : isPos ? '<span class="badge badge-orange">POS</span>'
                        : `<span class="badge badge-green">${r.dst_call||'?'}</span>`;
    return `<tr>
      <td class="mono">${r.time}</td>
      <td><b>${r.src_call||'—'}</b></td>
      <td>${badge}</td>
      <td class="mono" style="font-size:11px">${r.path||'—'}</td>
      <td>${rssiBar(r.rssi)}</td>
      <td style="color:var(--blue)">${r.snr != null ? r.snr+' dB' : '—'}</td>
    </tr>`;
  }).join('');
}

async function refresh() {
  await Promise.all([loadStatus(), loadMheard(), loadRxlog()]);
}

refresh();
setInterval(refresh, REFRESH);
</script>
</body>
</html>
