<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ callsign }} Mappa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0c0f;font-family:"Rajdhani",sans-serif}
header{background:#0f1318;border-bottom:1px solid #1e2a35;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.logo-text{font-family:"Share Tech Mono",monospace;font-size:18px;color:#00d4ff;letter-spacing:2px}
.logo-sub{font-size:11px;color:#4a6070;letter-spacing:3px;text-transform:uppercase}
.back-btn{font-family:"Share Tech Mono",monospace;font-size:11px;color:#00d4ff;text-decoration:none;border:1px solid #1e2a35;padding:6px 14px;letter-spacing:2px}
#map{height:calc(100vh - 90px);width:100%}
.leaflet-popup-content-wrapper{background:#0f1318;border:1px solid #00d4ff;border-radius:2px;color:#c8d8e8;font-family:"Share Tech Mono",monospace;font-size:11px}
.leaflet-popup-tip{background:#0f1318}
.stat-bar{display:flex;gap:16px;padding:8px 24px;background:#0f1318;border-bottom:1px solid #1e2a35;font-family:"Share Tech Mono",monospace;font-size:11px;color:#4a6070;flex-wrap:wrap;align-items:center}
.toggle-btn{font-family:"Share Tech Mono",monospace;font-size:10px;padding:4px 10px;border:1px solid #1e2a35;background:transparent;color:#4a6070;cursor:pointer;border-radius:3px;letter-spacing:1px}
.toggle-btn.active{border-color:#00d4ff;color:#00d4ff;background:rgba(0,212,255,0.1)}
<style>.nav-dropdown{position:relative;display:inline-block}.nav-btn{font-family:"Share Tech Mono",monospace;font-size:11px;color:#00d4ff;text-decoration:none;border:1px solid #1e2a35;padding:6px 14px;letter-spacing:2px;background:transparent;cursor:pointer;display:flex;align-items:center;gap:8px}.nav-btn:hover{border-color:#00d4ff}.nav-arrow{font-size:8px;transition:transform 0.2s}.nav-dropdown.open .nav-arrow{transform:rotate(180deg)}.dropdown-menu{display:none;position:absolute;right:0;top:100%;margin-top:4px;background:#0f1318;border:1px solid #1e2a35;min-width:160px;z-index:10000}.nav-dropdown.open .dropdown-menu{display:block}.dropdown-item{display:block;font-family:"Share Tech Mono",monospace;font-size:11px;color:#00d4ff;text-decoration:none;padding:8px 16px;letter-spacing:2px;white-space:nowrap;border-bottom:1px solid #1e2a35}.dropdown-item:last-child{border-bottom:none}.dropdown-item:hover{background:rgba(0,212,255,0.05)}.dropdown-item.active{color:#00ff9f}
[data-theme="light"]{
--bg:#f0f4f8;--bg2:#e1ecf7;--bg3:#e8eef4;--border:#d0dce8;
--accent:#0066aa;--accent2:#cc2200;--accent3:#007744;
--text:#1a2a3a;--text-dim:#6a8090;}
[data-theme="light"] body::before{background:none}
[data-theme="light"] .stat-card{box-shadow:0 1px 4px rgba(0,0,0,0.1)}
[data-theme="light"] .panel{box-shadow:0 1px 4px rgba(0,0,0,0.1)}
[data-theme="light"] .dropdown-menu{background:#e1ecf7;border-color:#d0dce8}[data-theme="light"] .dropdown-item{color:#0066aa;border-bottom-color:#d0dce8}[data-theme="light"] .dropdown-item:hover{background:rgba(0,102,170,0.05)}[data-theme="light"] .nav-btn{color:#0066aa;border-color:#d0dce8}</style></style>
</head>
<body>
<header>
  <div>
    <div class="logo-text">{{ callsign }}</div>
    <div class="logo-sub">Mappa stazioni &middot; ultimi 60 min</div>
  </div>
  <div style="display:flex;gap:8px"><a href="/" class="back-btn">&#8592; DASHBOARD</a></div>
</header>
<div class="stat-bar">
  <span>RF diretta: <span id="stat-rf" style="color:#00ff9f">-</span></span>
  <span>Digipeated: <span id="stat-digi" style="color:#ffd700">-</span></span>
  <span>MeshCom: <span id="stat-mesh" style="color:#bc8cff">-</span></span>
  <span>Totale: <span id="stat-total" style="color:#00d4ff">-</span></span>
  <span>Max distanza: <span id="stat-maxdist" style="color:#00d4ff">-</span></span>
  <span style="color:#00ff9f">&#9679; RF diretta</span>
  <span style="color:#ffd700">&#9679; GW/Digi</span>
  <span style="color:#bc8cff">&#9679; MeshCom</span>
  <button class="toggle-btn active" id="rep-btn" onclick="toggleFilter('rep')">D-STAR/EL ON</button>
  <div style="display:flex;gap:4px;align-items:center;margin-left:8px">
    <input id="search-call" type="text" placeholder="Cerca callsign..." style="font-family:var(--mono);font-size:10px;background:var(--bg);color:#00d4ff;border:1px solid #00d4ff;padding:3px 8px;outline:none;width:130px" onkeydown="if(event.key==='Enter')searchCallsign()">
    <button onclick="searchCallsign()" style="font-family:var(--mono);font-size:10px;padding:3px 8px;background:transparent;color:#00d4ff;border:1px solid #00d4ff;cursor:pointer">CERCA</button>
    <button onclick="clearSearch()" style="font-family:var(--mono);font-size:10px;padding:3px 8px;background:transparent;color:#00d4ff;border:1px solid var(--border);cursor:pointer">✕</button>
  </div>
  <button class="toggle-btn" id="coverage-btn" onclick="toggleCoverage()">COVERAGE OFF</button>
  <button class="toggle-btn" id="heatmap-btn" onclick="toggleHeatmap()">HEATMAP OFF</button>
  <select id="time-range" onchange="loadMap()" style="font-family:'Share Tech Mono',monospace;font-size:10px;padding:4px 8px;border:1px solid #1e2a35;background:#0f1318;color:#00d4ff;border-radius:3px;cursor:pointer">
    <option value="15">15 min</option>
    <option value="30">30 min</option>
    <option value="45">45 min</option>
    <option value="60" selected>60 min</option>
    <option value="90">90 min</option>
    <option value="120">2 ore</option>
    <option value="360">6 ore</option>
    <option value="720">12 ore</option>
    <option value="1440">24 ore</option>
  </select>
</div>
<div id="map"></div>

<script>
const map = L.map("map").setView([{{ lat }}, {{ lon }}], 9);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap", maxZoom: 18
}).addTo(map);



function addTwoHours(ts) {
  if (!ts) return "";
  const t = ts.length > 5 ? ts.substring(11, 16) : ts;
  const parts = t.split(":");
  let h = parseInt(parts[0]) + 2;
  if (h >= 24) h -= 24;
  return String(h).padStart(2, "0") + ":" + parts[1];
}

function makeLabel(callsign, color) {
  return "<div style='position:absolute;top:-16px;left:14px;color:" + color + ";font-size:9px;font-weight:bold;white-space:nowrap;background:rgba(0,0,0,0.6);padding:1px 3px;border-radius:2px'>" + callsign + "</div>";
}

let markers = [];
let heatLayer = null;
let heatmapActive = false;
let coverageLayer = null;
let coverageActive = false;

async function toggleCoverage() {
  coverageActive = !coverageActive;
  const btn = document.getElementById('coverage-btn');
  if (coverageActive) {
    btn.textContent = 'COVERAGE ON';
    btn.classList.add('active');
    const minutes = document.getElementById('time-range').value;
    const pts = await (await fetch('/api/coverage?minutes=' + minutes + '&_=' + Date.now())).json();
    if (pts.length > 2) {
      if (coverageLayer) map.removeLayer(coverageLayer);
      coverageLayer = L.polygon(pts, {
        color: '#00d4ff', weight: 2, opacity: 0.9,
        fillColor: '#00d4ff', fillOpacity: 0.25,
        dashArray: '6,4'
      }).addTo(map);
    }
  } else {
    btn.textContent = 'COVERAGE OFF';
    btn.classList.remove('active');
    if (coverageLayer) { map.removeLayer(coverageLayer); coverageLayer = null; }
  }
}

async function loadMap() {
  try {
    const minutes = document.getElementById("time-range").value;
    const data = await (await fetch("/api/map?minutes=" + minutes)).json();
    const rf = data.filter(s => s.type === "rf");
    const digi = data.filter(s => s.type === "digi");

    const mesh = data.filter(s => s.type === "meshcom");
    document.getElementById("stat-rf").textContent = rf.length;
    document.getElementById("stat-digi").textContent = digi.length;
    document.getElementById("stat-mesh").textContent = mesh.length;
    document.getElementById("stat-total").textContent = data.length;

    const dists = data.map(d => d.distance).filter(d => d > 0);
    if (dists.length) document.getElementById("stat-maxdist").textContent = Math.max(...dists) + " km";

    markers.forEach(m => map.removeLayer(m));
    markers = [];
    if(window.ownCluster) map.removeLayer(window.ownCluster);
    window.ownCluster = L.markerClusterGroup({
      iconCreateFunction: function(cluster) {
        return L.divIcon({className: "", html:
          "<div style='background:#ff8000;color:#000;width:28px;height:28px;border-radius:50%;border:2px solid white;box-shadow:0 0 8px #ff8000;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:11px;font-weight:bold'>"
          + cluster.getChildCount() + "</div>", iconSize: [28, 28], iconAnchor: [14, 14]});
      },
      maxClusterRadius: 40, spiderfyOnMaxZoom: true, showCoverageOnHover: false,
      disableClusteringAtZoom: 13, zoomToBoundsOnClick: false
    });
    if(window.stationCluster) map.removeLayer(window.stationCluster);
    window.stationCluster = L.layerGroup();
    data.forEach(function(s) {
      const color = s.type === "rf" ? "#00ff9f" : s.type === "meshcom" ? "#bc8cff" : s.type === "own" ? "#ff8000" : "#ffd700";
      const size = s.type === "own" ? 14 : 10;
      const ora = addTwoHours(s.last_ts);
      // Determina se è un tracker mobile (suffisso numerico diverso da -10/-11/-12/-13)
      const ssidMatch = s.callsign.match(/-(\d+)$/);
      const ssid = ssidMatch ? parseInt(ssidMatch[1]) : null;
      const isBalloon = s.path && (s.path.startsWith('APET') || s.path.startsWith('APRS') && s.comment && s.comment.toUpperCase().includes('BALLOON'));
      const commentUpper = (s.comment || '').toUpperCase();
      const isTrackerByComment = commentUpper.includes('TRACKER');
      const isGWbyRange = !isTrackerByComment && ssid !== null && ssid >= 10 && ssid <= 99;
      const isGWbyComment = !isGWbyRange && (commentUpper.includes('DIGI') || commentUpper.includes('IGATE') || commentUpper.includes('GATEWAY') || commentUpper.includes('GRF') || /^IR\d/.test(s.callsign) || /^IQ\d/.test(s.callsign) || (commentUpper.includes('LORA APRS') && (commentUpper.includes('IGATE') || commentUpper.includes('DIGI') || commentUpper.includes('GATEWAY'))));
      const isMobile = !isBalloon && !isGWbyComment && !isGWbyRange && ssid !== null && !(ssid >= 10 && ssid <= 99);
      let html;
      if (isBalloon) {
        html = "<div style='position:relative'>"
          + "<div style='font-size:16px;line-height:1;filter:drop-shadow(0 0 3px " + color + ")'>🎈</div>"
          + makeLabel(s.callsign, color)
          + "</div>";
      } else if (isMobile) {
        html = "<div style='position:relative'>"
          + "<div style='font-size:16px;line-height:1;filter:drop-shadow(0 0 3px " + color + ")'>🚗</div>"
          + makeLabel(s.callsign, color)
          + "</div>";
      } else if (isGWbyRange || isGWbyComment) {
        html = "<div style='position:relative'>"
          + "<div style='background:" + color + ";width:20px;height:20px;border-radius:50%;border:2px solid white;box-shadow:0 0 6px " + color + ";display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:bold;color:#000;letter-spacing:-0.5px'>GW</div>"
          + makeLabel(s.callsign, color)
          + "</div>";
      } else {
        html = "<div style='position:relative'>"
          + "<div style='background:" + color + ";width:" + size + "px;height:" + size + "px;border-radius:50%;border:2px solid white;box-shadow:0 0 6px " + color + "'></div>"
          + makeLabel(s.callsign, color)
          + "</div>";
      }
      const marker = L.marker([s.lat, s.lon], {
        icon: L.divIcon({ className: "", html: html, iconSize: [size, size], iconAnchor: [size/2, size/2] })
      });
      marker._callsign = s.callsign;
      // Parsing WX dal comment
      let wxStr = "";
      if (s.comment) {
        const tM = s.comment.match(/t(-?\d{3})/);
        const hM = s.comment.match(/h(\d{2})/);
        const bM = s.comment.match(/b(\d{5})/);
        let wx = [];
        if (tM) { const c = Math.round((parseInt(tM[1])-32)*5/9); wx.push("🌡 "+c+"°C"); }
        if (hM) { wx.push("💧 "+parseInt(hM[1])+"%"); }
        if (bM) { wx.push("⏱ "+(parseInt(bM[1])/10).toFixed(1)+" hPa"); }
        if (wx.length) wxStr = "<br><small>"+wx.join(" &nbsp; ")+"</small>";
      }
      marker.bindPopup(
        "<b>" + s.callsign + "</b><br>"
        + "Tipo: " + (s.type === "rf" ? "RF diretta" : s.type === "meshcom" ? "MeshCom" : s.type === "own" ? "Nodo locale" : "Digipeated") + "<br>"
        + "RSSI: " + s.rssi + " dBm<br>"
        + "Distanza: " + s.distance + " km<br>"
        + "Ultimo: " + ora
        + (s.voltage ? "<br>🔋 " + s.voltage + " V" : "")
        + wxStr
      );
      if(s.type === "own") {
        window.ownCluster.addLayer(marker);
      } else {
        window.stationCluster.addLayer(marker);
        markers.push(marker);
      }
    });
    map.addLayer(window.ownCluster);
    map.addLayer(window.stationCluster);
  } catch(e) { console.error(e); }
  // tracce stazioni in movimento
  try {
    if(window.trackLayers) window.trackLayers.forEach(l => map.removeLayer(l));
    window.trackLayers = [];
    const trackColors = ['#00ff9f','#ff6b35','#00d4ff','#ff4dff','#ffd700','#ff4444','#4dffb4','#ff9f00'];
    const trackColorMap = {};
    let trackColorIdx = 0;
    function getTrackColor(callsign) {
      if (!trackColorMap[callsign]) {
        trackColorMap[callsign] = trackColors[trackColorIdx % trackColors.length];
        trackColorIdx++;
      }
      return trackColorMap[callsign];
    }
    const minutes2 = document.getElementById("time-range").value;
    const tracks = await (await fetch("/api/tracks?minutes=" + minutes2)).json();
    Object.keys(tracks).forEach(function(call){
      const t = tracks[call];
      if(!t.points || t.points.length < 2) return;
      const color = t.type === "rf" ? "#00ff9f" : t.type === "meshcom" ? "#bc8cff" : "#ffd700";
      const latlngs = t.points.map(p => [p.lat, p.lon]);
      const trackColor = getTrackColor(call);
      const line = L.polyline(latlngs, {color: trackColor, weight: 5, opacity: 0.9}).addTo(map);
      window.trackLayers.push(line);
      t.points.forEach(function(p, i){
        if(i === t.points.length-1) return;
        const dot = L.circleMarker([p.lat, p.lon], {radius: 2, color: '#000000', fillColor: '#000000', fillOpacity: 0.8, weight: 1}).addTo(map);
        dot.bindTooltip(call + " " + p.time, {permanent: false});
        window.trackLayers.push(dot);
      });
    });
  } catch(e) { console.error(e); }
}

async function loadHeatmap() {
  try {
    const data = await (await fetch("/api/heatmap")).json();
    if (heatLayer) {
      map.removeLayer(heatLayer);
    }
    heatLayer = L.heatLayer(data, {
      radius: 25,
      blur: 20,
      maxZoom: 12,
      max: 1.0,
      gradient: {0.2: 'blue', 0.4: 'cyan', 0.6: 'lime', 0.8: 'yellow', 1.0: 'red'}
    }).addTo(map);
  } catch(e) { console.error(e); }
}

let showAprs = true;
let showRep = true;

function isAprs(callsign) {
  // Suffisso numerico -1 a -15
  return /^[A-Z0-9]+-\d{1,2}$/.test(callsign);
}

function toggleFilter(type) {
  if (type === 'aprs') {
    showAprs = !showAprs;
    const btn = document.getElementById('aprs-btn');
    btn.textContent = showAprs ? 'APRS ON' : 'APRS OFF';
    showAprs ? btn.classList.add('active') : btn.classList.remove('active');
  } else {
    showRep = !showRep;
    const btn = document.getElementById('rep-btn');
    btn.textContent = showRep ? 'D-STAR/EL ON' : 'D-STAR/EL OFF';
    showRep ? btn.classList.add('active') : btn.classList.remove('active');
  }
  // Aggiorna visibilità marker
  markers.forEach(function(m) {
    const call = m._callsign;
    if (!call) return;
    const aprs = isAprs(call);
    if ((aprs && !showAprs) || (!aprs && !showRep)) {
      map.removeLayer(m);
    } else {
      m.addTo(map);
    }
  });
}

function searchCallsign() {
  const q = document.getElementById('search-call').value.trim().toUpperCase();
  if (!q) return;
  let found = null;
  if(window.stationCluster) window.stationCluster.eachLayer(function(m) {
    if (m._callsign && m._callsign.toUpperCase() === q) found = m;
  });
  if (!found && window.ownCluster) window.ownCluster.eachLayer(function(m) {
    if (m._callsign && m._callsign.toUpperCase() === q) found = m;
  });
  if (found) {
    map.setView(found.getLatLng(), 13);
    found.openPopup();
  } else {
    alert('Stazione ' + q + ' non trovata nella finestra temporale corrente');
  }
}
function clearSearch() {
  document.getElementById('search-call').value = '';
}
function toggleHeatmap() {
  heatmapActive = !heatmapActive;
  const btn = document.getElementById("heatmap-btn");
  if (heatmapActive) {
    btn.textContent = "HEATMAP ON";
    btn.classList.add("active");
    loadHeatmap();
  } else {
    btn.textContent = "HEATMAP OFF";
    btn.classList.remove("active");
    if (heatLayer) {
      map.removeLayer(heatLayer);
      heatLayer = null;
    }
  }
}

loadMap();
setInterval(loadMap, 10000);
</script>

<script>
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = t === 'light' ? '☾ TEMA' : '☀ TEMA';
}
const saved = localStorage.getItem('theme') || 'dark';
applyTheme(saved);
window.addEventListener('storage', function(e){
  if(e.key === 'theme_change'){
    const t = localStorage.getItem('theme') || 'dark';
    applyTheme(t);
  }
});
</script>
</body>
</html>
